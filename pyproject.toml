[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["course"]
include = ["config*"]

[tool.setuptools]
package-dir = {"" = "course"}

[project]
name = "ai-agent-tutorial"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.4",
    "langchain-community>=0.3.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.2.2",
    "langchain-text-splitters>=1.1.0",
    "numpy>=1.26.0",
    "openai>=2.41.0",
    "pdfminer-six>=20260107",
    "pypdf>=6.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "langchain-mcp-adapters>=0.3.2",
    "streamlit>=1.40.0",
    "a2a-sdk>=1.1.5,<2",
    "fastmcp>=3.4.7,<4",
    "httpx>=0.27.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "deepagents>=0.7.18,<0.8",
    "langfuse>=4.15.4,<5",
    "truststore>=0.10.4",
    "mcp>=1.24,<2",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6.29,<8",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<1",
    "nbconvert>=7.16,<8",
]
dev = [
    "pytest>=8.0.0",
    "pyviz-tutor>=0.1.5",
    "viztracer>=1.1.1",
]
teaching = [
    "diagrams>=0.25.1",
    "graphviz>=0.20.3",
    "ipytest>=0.14.2",
    "ipywidgets>=8.1.9",
    "jupytercards>=3.2.1",
    "jupyterquiz>=2.9.6.4",
    "jupytext>=1.19.5",
    "matplotlib>=3.11.2",
    "nbstripout>=0.9.1",
    "plotly>=7.1.0",
]
