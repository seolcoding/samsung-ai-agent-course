<div id="file-app" style="font-family:sans-serif;padding:12px;border:1px solid #ccc;border-radius:8px;max-width:320px">
  <h3 style="margin:0 0 8px">파일에서 읽어 온 웹앱</h3>
  <input id="file-app-input" placeholder="이름을 입력하세요" style="padding:4px">
  <button id="file-app-btn">인사하기</button>
  <p id="file-app-out"></p>
</div>
<script>
  document.getElementById("file-app-btn").onclick = () => {
    const name = document.getElementById("file-app-input").value || "수강생";
    document.getElementById("file-app-out").textContent = `안녕하세요, ${name}님!`;
  };
</script>
